openapi: 3.0.3
info:
  title: NeetoRecord Analytics APIs
  version: 2.0.0

servers:
  $ref: '../schemas/common.yaml#/servers'

tags:
  - name: Analytics
    description: APIs to retrieve workspace wide recording and view counts.

paths:
  /analytics:
    get:
      summary: Get workspace analytics
      tags:
        - Analytics
      description: >-
        Retrieves how many uploaded recordings and views the workspace has, along with its ten most
        watched recordings. For a single recording's view history, use the
        [Get view analytics for a recording](/api-reference/recordings/analytics) API.
      parameters:
        - $ref: '../schemas/common.yaml#/api_key_header'
        - $ref: '../schemas/common.yaml#/accept_header'
        - in: query
          name: from_date
          required: false
          description: >-
            Only count recordings created on or after this date, in `YYYY-MM-DD` format. Filters on
            when a recording was created, not when it was viewed.
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - in: query
          name: to_date
          required: false
          description: >-
            Only count recordings created on or before this date, in `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
            example: "2026-06-30"
      responses:
        '200':
          description: Successfully retrieved analytics.
          content:
            application/json:
              schema:
                $ref: '../schemas/analytics.yaml#/components/schemas/organization_analytics_response'
              example:
                total_recordings: 95
                total_views: 1840
                top_recordings:
                  - id: "x9y8z7w6v5u4t3s2"
                    title: "Product demo walkthrough"
                    view_count: 42
                  - id: "a1b2c3d4e5f6g7h8"
                    title: "Sprint planning meeting"
                    view_count: 5
        '422':
          description: A date could not be parsed.
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/error'
              example:
                error: "Invalid from_date '2026-13-01'. Expected ISO format (e.g. '2024-01-01')."
