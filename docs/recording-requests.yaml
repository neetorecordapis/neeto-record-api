openapi: 3.0.3
info:
  title: NeetoRecord Recording Requests APIs
  version: 2.0.0

servers:
  $ref: '../schemas/common.yaml#/servers'

tags:
  - name: Recording Requests
    description: APIs to ask someone to record and upload a video.

paths:
  /recording_requests:
    post:
      summary: Create a recording request
      tags:
        - Recording Requests
      description: >-
        Creates a recording request and returns a URL to share with whoever will record the video.
        The request is created on behalf of an active member of the workspace, and it counts against
        that person's monthly recording limit.
      parameters:
        - $ref: '../schemas/common.yaml#/api_key_header'
        - $ref: '../schemas/common.yaml#/accept_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recording
              properties:
                recording:
                  type: object
                  required:
                    - title
                    - created_by_email
                  properties:
                    title:
                      type: string
                      description: Title of the requested recording.
                      example: "Walk me through the billing bug"
                    created_by_email:
                      type: string
                      format: email
                      description: >-
                        Email of the workspace member making the request. Must belong to an active
                        user in the workspace.
                      example: "oliver@example.com"
                    request_instructions:
                      type: string
                      description: Instructions shown to the person who opens the request link.
                      example: "Start from the invoice list and reproduce the error."
                    request_notes:
                      type: string
                      description: Private notes about the request, not shown to the recipient.
                      example: "Raised by support ticket 4821."
      responses:
        '201':
          description: The recording request was created.
          content:
            application/json:
              schema:
                $ref: '../schemas/recording-request.yaml#/components/schemas/recording_request_create_response'
              example:
                recording_request:
                  id: "7d2e5b90-1c34-4a68-b7f5-9e0a2c3d4b18"
                  title: "Walk me through the billing bug"
                  request_url: "https://your-workspace.neetorecord.com/request/7d2e5b90-1c34-4a68-b7f5-9e0a2c3d4b18"
                  created_at: "2026-02-14T08:31:47.000Z"
        '403':
          description: The requester has reached their monthly recording limit.
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/error'
              example:
                error: "You have reached your limit of free recordings this month."
        '422':
          description: >-
            `title` or `created_by_email` is missing, or no active user matches the given email.
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/error'
              examples:
                missing_params:
                  summary: Required attributes missing
                  value:
                    error: "Title and created_by_email are required."
                creator_not_found:
                  summary: No active user with that email
                  value:
                    error: "Could not find active user with the specified email."
